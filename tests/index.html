<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小説エディター テスト</title>
<style>
  :root { --bg: #fff; --text: #222; --ok: #1b7f3b; --ng: #b3261e; --muted: #666; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1c1e; --text: #e6e3dd; --ok: #7fd49a; --ng: #f2b8b5; --muted: #aaa; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.6 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #summary { font-weight: 700; margin-bottom: 12px; }
  .ok { color: var(--ok); } .ng { color: var(--ng); }
  li { margin: 2px 0; } pre { white-space: pre-wrap; color: var(--muted); margin: 2px 0 6px 16px; font-size: 12px; }
</style>
</head>
<body>
<h1>小説エディター 自動テスト</h1>
<div id="summary">実行中…</div>
<ul id="results"></ul>
<script type="module" src="tests.js"></script>
</body>
</html>
